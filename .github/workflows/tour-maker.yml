name: Tour maker smoke test

# Runs the tour maker against the real OpenStreetMap, Wikipedia, Nominatim and OSRM (Claude is
# stood in for), in Amsterdam on foot and Utrecht by bike, whenever its code changes.
on:
  push:
    paths: ['berlin-divided/lib/**', 'tests/generate-live.mjs', '.github/workflows/tour-maker.yml']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd berlin-divided && npm ci
      - run: node tests/generate-live.mjs 52.3731 4.8914 60 walk
      - run: node tests/generate-live.mjs 52.0907 5.1214 90 bike

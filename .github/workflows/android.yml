name: Android APK

# Builds a debug-signed APK that opens the tour web app. Download it from the run's Artifacts.
# Set the repository variable TOUR_URL (Settings > Secrets and variables > Actions > Variables) to
# the Railway address, or type it when running by hand; without one the app asks on first start.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Web address of the tour app (https://...)
        required: false
  push:
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle -p android assembleDebug --no-daemon -PtourUrl="${URL}"
        env:
          URL: ${{ inputs.url || vars.TOUR_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: audio-tours-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

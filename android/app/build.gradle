plugins { id 'com.android.application' }

// The web app this app opens, as a Trusted Web Activity (Chrome without the address bar).
// Override with -PtourUrl=https://...; the site must serve /.well-known/assetlinks.json for this app.
def tourUrl = (project.findProperty('tourUrl') ?: 'https://toursjelle123-production.up.railway.app').toString().replaceAll('/$', '')
def host = new URI(tourUrl).host
// release signing comes from the environment (GitHub secrets); without it only a debug build is made
def ks = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.toursjelle.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.toursjelle.app'
        minSdk 24
        targetSdk 36
        versionCode((System.getenv('VERSION_CODE') ?: '1').toInteger())
        versionName "1.0.${System.getenv('VERSION_CODE') ?: '0'}"
        resValue 'string', 'launchUrl', tourUrl + '/'
        resValue 'string', 'hostName', host
        resValue 'string', 'asset_statements', "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"${tourUrl}\\\"}}]"
    }
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
